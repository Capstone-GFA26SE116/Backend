name: Deploy .NET Core App to Azure Web App

on:
  push:
    branches:
      - develop

env:
  AZURE_WEBAPP_NAME: metanoia-backend-core
  DOTNET_VERSION: '8.0.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Trỏ thẳng vào thư mục METANOIA để dotnet tự nhận diện file solution (.slnx/.sln)
      - name: Restore dependencies
        run: dotnet restore METANOIA

      - name: Build app
        run: dotnet build METANOIA --configuration Release --no-restore

      # Publish thư mục project Web API (METANOIA/METANOIA)
      - name: Publish app
        run: dotnet publish METANOIA/METANOIA -c Release -o ./publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish