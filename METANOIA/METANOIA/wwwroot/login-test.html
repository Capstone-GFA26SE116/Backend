<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>METANOIA - Google Login Test</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
    textarea { width: 100%; height: 140px; margin-top: 12px; font-family: monospace; font-size: 12px; }
    #clientIdInput { width: 100%; padding: 8px; margin-bottom: 16px; box-sizing: border-box; }
    button { margin-top: 8px; padding: 6px 14px; cursor: pointer; }
    .hint { color: #666; font-size: 13px; }
  </style>
</head>
<body>
  <h2>METANOIA - Lấy Google ID Token để test Swagger</h2>

  <p class="hint">1. Dán Google OAuth Client ID của bạn vào ô dưới rồi bấm "Tải nút đăng nhập".</p>
  <input id="clientIdInput" type="text" placeholder="xxxxxxxxxx.apps.googleusercontent.com" />
  <button onclick="renderButton()">Tải nút đăng nhập</button>

  <div id="buttonDiv" style="margin-top:16px;"></div>

  <p class="hint">2. Sau khi đăng nhập, copy ID token bên dưới và dán vào Swagger ở field "idToken" của API POST /api/auth/google.</p>
  <textarea id="tokenBox" readonly placeholder="ID token sẽ hiện ở đây sau khi đăng nhập..."></textarea>
  <button onclick="copyToken()">Copy token</button>

  <script>
    function renderButton() {
      const clientId = document.getElementById('clientIdInput').value.trim();
      if (!clientId) {
        alert('Nhập Client ID trước đã.');
        return;
      }
      google.accounts.id.initialize({
        client_id: clientId,
        callback: handleCredentialResponse
      });
      google.accounts.id.renderButton(
        document.getElementById('buttonDiv'),
        { theme: 'outline', size: 'large' }
      );
    }

    function handleCredentialResponse(response) {
      document.getElementById('tokenBox').value = response.credential;
    }

    function copyToken() {
      const box = document.getElementById('tokenBox');
      box.select();
      document.execCommand('copy');
    }
  </script>
</body>
</html>
